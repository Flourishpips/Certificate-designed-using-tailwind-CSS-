<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Certificate</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
    </style>
</head>
<body>
    <div class="outer_container w-[800px] h-[600px] border-4 place-content-center border-[#8149d9] bg-[#cacaca] overflow-hidden relative mx-auto">
        <div class="oval w-[200px] h-[250px] bg-[#16072e]  absolute top-1 left-1 rounded-[0 right-full]"></div>
        <div class="oval w-[200px] h-[250px] bg-[#16072e]  absolute bottom-1 right-1"></div>
        <div class="inner_container w-[730px] h-[530px] border-4 border-[#8149d9] bg-[#cacaca] justify-self-center relative">
            <div class="relative h-64 w-12 bg-[#cacaca]  p-8 left-14">
            
            <div class="absolute top-0 right-4 w-14 h-20 bg-[#16072e] 
                    before:absolute before:bottom-0 before:left-0 before:border-l-[28px] before:border-r-[28px] before:border-b-[20px] 
                    before:border-l-transparent before:border-r-transparent before:border-b-[#cacaca]">
            
            </div>

            </div>

            <h1 class="cert text-[#16072e] absolute justify-self-center top-[40px] text-6xl font-thin">CERTIFICATE</h1>
            <p class="participation absolute justify-self-center top-[100px] ">OF PARTICIPATION</p>
            <p class="present absolute justify-self-center top-[150px] font-semibold text-sm">WE ARE PROUDLY PRESENT THIS TO</p>
            <p class="name absolute justify-self-center text-5xl top-[200px] font-[Great_Vibes] text-[#16072e]">Kimberly Thompson</p>
            <hr class="name_udl absolute w-[350px] top-[260px] justify-self-center">
            <p class="absolute justify-self-center top-[270px] text-center font-semibold font-[Tapestry] text-black">Course Title</p>
            <p class="description absolute justify-self-center top-[300px] text-center text-xs font-semibold">WE GIVE THIS CERTIFICATE BECAUSE KIMBERLY THOMPSON HAS <br>PARTICIPATED IN A SOCIAL EVENT THAT WE ORGANIZE.
            </p>
            <div class="absolute bottom-[160px] justify-self-center flex">
                <p class="date text-sm font-semibold">DATE: </p>
                <hr class="date_udl w-[120px] mx-2 self-end">
            </div>
            <div class="circ self-start absolute justify-self-center bottom-[80px]">
                    <div class="circle w-[55px] h-[55px] border-2 rounded-full bg-[#16072e] place-content-center relative">
                        <div class="circle w-[50px] h-[50px] border-2 border-white rounded-full bg-[#16072e] justify-self-center"></div>
                    </div>
            </div>
            <div class="signature absolute gap-[180px] bottom-[40px] flex justify-self-center">
                <span class="president grid justify-center gap-[5px]">
                    <hr class="prt w-[150px] justify-self-center">
                    <p class="text-xl justify-self-center">Isabel Mercado</p>
                    <p class="text-lg justify-self-center">President</p>
                </span>
                
                <span class="president grid justify-center gap-[5px]">
                    <hr class="prt w-[150px] justify-self-center">
                    <p class="text-xl justify-self-center">Kimberly Nguyen</p>
                    <p class="text-lg justify-self-center">Vice President</p>
                </span>

            </div>

        </div>

    </div>
    
</body>
</html>
